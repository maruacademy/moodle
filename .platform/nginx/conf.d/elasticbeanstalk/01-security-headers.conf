# 1. Force HTTPS for 1 year across all subdomains (omit 'preload' unless every subdomain is strictly HTTPS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 2. Prevent MIME-type sniffing on uploaded course files
add_header X-Content-Type-Options "nosniff" always;

# 3. Prevent leaking internal Moodle course/user URLs to external sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 4. Prevent clickjacking while allowing Moodle's own internal iframes (SCORM/H5P)
add_header X-Frame-Options "SAMEORIGIN" always;

# 5. Moodle-compatible baseline CSP (test in Report-Only first, then rename to Content-Security-Policy)
#add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

#add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-src 'self' https://player.vimeo.com https://vimeo.com blob: data:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

# Enforced CSP supporting Moodle, Vimeo embeds, and Google reCAPTCHA
#add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' https: 'unsafe-inline' 'unsafe-eval' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.recaptcha.net/recaptcha/; frame-src 'self' https://player.vimeo.com https://vimeo.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/ blob: data:; connect-src 'self' https: https://www.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

# Enforced CSP supporting Moodle, moodle.org, Vimeo embeds, and Google reCAPTCHA
add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' https: 'unsafe-inline' 'unsafe-eval' https://moodle.org https://*.moodle.org https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.recaptcha.net/recaptcha/; frame-src 'self' https://moodle.org https://*.moodle.org https://player.vimeo.com https://vimeo.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/ blob: data:; connect-src 'self' https: https://moodle.org https://*.moodle.org https://www.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;
